<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F243D" />
      <stop offset="100%" stop-color="#071322" />
    </linearGradient>
    <linearGradient id="favOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA033" />
      <stop offset="60%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#E54F00" />
    </linearGradient>
    <radialGradient id="favSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFCA80" />
      <stop offset="60%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#C43800" />
    </radialGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#favBg)" />

  <!-- Inner subtle border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- WiFi & Arrow Mark -->
  <g transform="translate(48, 14) scale(0.48)">
    <circle cx="28" cy="74" r="8" fill="url(#favSphere)" />
    <path d="M 18 56 A 26 26 0 0 1 58 24" fill="none" stroke="url(#favOrange)" stroke-width="10" stroke-linecap="round" />
    <path d="M 4 40 A 46 46 0 0 1 76 0" fill="none" stroke="url(#favOrange)" stroke-width="12" stroke-linecap="round" />
    <path d="M 16 78 C 38 48 85 36 142 36 L 138 20 L 180 40 L 144 70 L 142 52 C 96 52 56 64 30 88 Z" fill="url(#favOrange)" />
  </g>

  <!-- Lettermark 'tsk05' centered -->
  <g transform="translate(64, 82)">
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#FFFFFF">tsk</tspan><tspan fill="#FFFFFF">0</tspan><tspan fill="url(#favOrange)">5</tspan>
    </text>
    <!-- Dot in the center of 0 -->
    <circle cx="21" cy="-10" r="4.2" fill="url(#favSphere)" />
  </g>

  <!-- 'connect' badge accent -->
  <text x="64" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" font-weight="800" letter-spacing="1.2" fill="url(#favOrange)">
    CONNECT
  </text>
</svg>